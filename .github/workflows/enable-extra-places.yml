name: Enable extra Places

on:
  push:
    paths:
      - "scripts/enable_extra_places.py"
      - ".github/workflows/enable-extra-places.yml"
      - "data/places_extra.csv"
      - "data/places_services.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Update index loader
        run: python scripts/enable_extra_places.py
      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load expanded Places data"
          git push

name: Mark user locations verified

on:
  push:
    paths:
      - "scripts/mark_user_locations_verified.py"
      - "data/places_toilets_user.csv"
      - ".github/workflows/mark-user-locations-verified.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Patch verification logic
        run: python scripts/mark_user_locations_verified.py
      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Treat user-confirmed locations as verified"
          git push

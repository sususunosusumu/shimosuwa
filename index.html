<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>下諏訪 時間プランナー v3.6</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#1f2933;--muted:#667085;--bg:#f5f6f4;--panel:#fff;--line:#d8dde3;--main:#245e52;--snack:#e9a23b;--lunch:#3f8b68;--landmark:#4b78b5;--travel:#98a2b3;--flex:#e8ecef;--danger:#c94545}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;margin:0;background:var(--bg);color:var(--ink)}
.w{max-width:1080px;margin:auto;padding:16px}.topline{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:27px}.version{font-size:12px;background:#e7f1ed;color:#184b40;border-radius:999px;padding:4px 9px;font-weight:700}.small{font-size:13px;color:var(--muted);line-height:1.55}.p{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 3px 16px rgba(20,35,45,.035)}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}select,input,button{font:inherit;padding:10px;border-radius:10px}select,input{width:100%;border:1px solid #ccd3da;background:#fff}button{border:0;background:var(--main);color:#fff;font-weight:700;cursor:pointer;margin:5px 4px 0 0}button.alt{background:#e8ecef;color:#263238}button.warn{background:#fff1c8;color:#684e00;border:1px solid #efd890}.endpoint{padding:2px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{background:#eef2f2;border-radius:999px;padding:5px 9px;font-size:12px;color:#42515d}.notice{border-radius:12px;padding:10px 12px;background:#f7f8f8;font-size:13px;color:#51606c;margin:8px 0}.notice.bad{background:#fff0f0;color:#8f3030}.result-title{font-weight:800;font-size:18px;margin-bottom:6px}
#map{height:420px;border-radius:14px}.map-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.schedule-wrap{position:relative;overflow-x:auto;padding:4px 0 10px}.schedule{position:relative;min-width:420px;margin-top:8px}.time-label{position:absolute;left:0;width:58px;transform:translateY(-8px);font-size:12px;font-weight:700;color:#667085;text-align:right;padding-right:9px}.hour-line{position:absolute;left:65px;right:0;border-top:1px solid #e2e6ea}.half-line{position:absolute;left:65px;right:0;border-top:1px dashed #eff1f3}.lane{position:absolute;left:72px;right:4px;top:0}.block{position:absolute;left:0;right:0;border-radius:12px;padding:7px 10px;overflow:hidden;border:1px solid rgba(0,0,0,.08);box-shadow:0 2px 7px rgba(0,0,0,.045);cursor:default}.block .bt{font-size:12px;font-weight:800;opacity:.85}.block .bn{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.block .bm{font-size:11px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.block.travel{background:#f0f2f4;color:#53606b;border-style:dashed}.block.flex{background:#fafbfb;color:#7a858f;border-style:dashed}.block.snack{background:#fff0d9;color:#764b08}.block.lunch{background:#e5f3eb;color:#235d43}.block.landmark{background:#e7eef9;color:#294f82}.block.start,.block.goal{background:#dceee8;color:#174f42}.block.late{background:#fde8e8;color:#8f3030;border-color:#efbaba}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:#667085}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}.route-list{margin-top:16px;border-top:1px solid #edf0f2;padding-top:10px}.route-row{display:grid;grid-template-columns:92px 1fr;gap:9px;padding:7px 0;border-bottom:1px solid #f0f2f3}.route-time{font-weight:800;font-size:13px}.route-name{font-weight:700}.muted{font-size:12px;color:var(--muted)}details summary{cursor:pointer;font-weight:800}.data-row{margin-top:12px}.status-ok{color:#226447}.status-warn{color:#826400}
@media(max-width:740px){.w{padding:12px}.g,.g3,.g4{grid-template-columns:1fr}#map{height:345px}.schedule{min-width:335px}.route-row{grid-template-columns:78px 1fr}h1{font-size:23px}.p{padding:13px}}
</style>
</head>
<body>
<div class="w">
  <div class="topline"><div><h1>下諏訪 時間プランナー</h1><div class="small">町の中で「どう時間を過ごすか」を組み立てる試作</div></div><span class="version">v3.6</span></div>

  <div class="p g">
    <div class="endpoint"><label>START</label><select id="s"></select><button onclick="gps('s')">現在地GPS</button><button class="alt" onclick="pick='s'">地図から選ぶ</button><div id="sc" class="small">未設定</div></div>
    <div class="endpoint"><label>GOAL</label><select id="e"></select><button onclick="gps('e')">現在地GPS</button><button class="alt" onclick="pick='e'">地図から選ぶ</button><div id="ec" class="small">未設定</div></div>
  </div>

  <div class="p g4">
    <div><label>曜日</label><select id="weekday"><option value="月">月曜日</option><option value="火">火曜日</option><option value="水">水曜日</option><option value="木">木曜日</option><option value="金">金曜日</option><option value="土">土曜日</option><option value="日">日曜日</option></select></div>
    <div><label>開始時刻</label><input id="st" type="time" value="09:00"></div>
    <div><label>終了時刻</label><input id="et" type="time" value="16:00"></div>
    <div><label>移動方法</label><select id="moveMode"><option value="walk">徒歩（現在の試算）</option></select></div>
  </div>

  <div class="p g3">
    <div><label>10時のおやつ</label><input id="sn1" type="time" value="10:00"></div>
    <div><label>昼食</label><input id="lu" type="time" value="12:00"></div>
    <div><label>15時のおやつ</label><input id="sn2" type="time" value="15:00"></div>
  </div>

  <div class="p">
    <button onclick="plan(false)">プランを作る</button><button class="alt" onclick="plan(true)">別プラン</button>
    <div id="result" style="margin-top:14px"><div class="small">STARTとGOALを設定してプランを作ってください。</div></div>
  </div>

  <div class="p">
    <div class="map-tools"><b>地図</b><span id="status" class="small">データ読込中...</span></div>
    <div id="map"></div>
    <div class="small" style="margin-top:8px">● Place　・ 小さい点は既存GISのあざみ号／スワンバス停。現時点の徒歩時間は直線距離＋補正で概算しています。</div>
  </div>

  <div class="p">
    <details>
      <summary>データ整備ツール</summary>
      <div class="data-row small">座標が未取得のPlaceは、国土地理院の住所検索で仮座標を取得できます。取得値はこの端末のブラウザに保存されます。</div>
      <button class="warn" onclick="geocodeMissing()">未取得座標を自動取得</button><div id="geoStatus" class="small"></div>
      <div class="data-row g"><div><label>Google実ピンを補正するPlace</label><select id="gmPlace"></select></div><div><label>Google Maps URL</label><input id="gmUrl" placeholder="Google Mapsで対象Placeを開いたURL"></div></div>
      <button onclick="applyGooglePin()">Google実ピンを反映</button><button class="alt" onclick="openSelectedGoogle()">Google Mapsで開く</button><button class="alt" onclick="exportPlacesCsv()">補正済みCSVを書き出す</button><div id="gmStatus" class="small"></div>
    </details>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let P=[],B=[],pick=null,points={s:null,e:null},markers={s:null,e:null},all=[],routeLine=null;
const map=L.map('map').setView([36.075,138.083],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const placeLayer=L.layerGroup().addTo(map), busLayer=L.layerGroup().addTo(map);

function parseCSV(t){let a=[],r=[],f='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){f+='"';i++}else q=!q}else if(c===','&&!q){r.push(f);f=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.length>1)a.push(r);r=[]}else f+=c}if(r.length||f){r.push(f);a.push(r)}let h=a.shift();return a.filter(x=>x.some(Boolean)).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||''])))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tm(s){let[h,m]=String(s).split(':').map(Number);return h*60+m}
function ft(n){n=Math.round(n);return String(Math.floor(n/60)%24).padStart(2,'0')+':'+String((n%60+60)%60).padStart(2,'0')}
function dist(a,b){const R=6371,rad=x=>x*Math.PI/180,dp=rad(b.lat-a.lat),dl=rad(b.lng-a.lng),q=Math.sin(dp/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function walk(a,b){return Math.max(3,Math.round(dist(a,b)/4*60*1.15))}
function pointOf(p){return {lat:+p.latitude,lng:+p.longitude,name:p['名称']}}
function setPoint(t,lat,lng,n){points[t]={lat:+lat,lng:+lng,name:n};document.getElementById(t+'c').textContent=n+' / '+(+lat).toFixed(6)+', '+(+lng).toFixed(6);if(markers[t])map.removeLayer(markers[t]);markers[t]=L.marker([lat,lng]).addTo(map).bindPopup(t==='s'?'START':'GOAL').openPopup();map.setView([lat,lng],15)}
function gps(t){if(!navigator.geolocation){alert('このブラウザではGPSを利用できません');return}navigator.geolocation.getCurrentPosition(p=>setPoint(t,p.coords.latitude,p.coords.longitude,'現在地'),()=>alert('位置情報を取得できませんでした。位置情報の許可を確認してください。'))}
map.on('click',x=>{if(pick){setPoint(pick,x.latlng.lat,x.latlng.lng,'地図で選択');pick=null}});

function isOpenDay(p){const wd=weekday.value,closed=p['定休日']||'',days=p['営業日']||'';if(closed.includes(wd))return false;if(days&&days!=='毎日'&&!days.includes(wd)&&!days.includes('平日'))return false;if(days.includes('平日')&&['土','日'].includes(wd))return false;return true}
function openAt(p,min){if(!isOpenDay(p))return false;let h=(p['営業時間']||'').replaceAll('頃','');if(!h||h.includes('24時間'))return true;let ranges=[...h.matchAll(/(\d{1,2}):(\d{2})\s*[-〜~]\s*(\d{1,2}):(\d{2})/g)];if(!ranges.length)return true;return ranges.some(x=>{let a=+x[1]*60 + +x[2],b=+x[3]*60 + +x[4];if(b===0)b=1440;return min>=a&&min<=b})}
function stayMinutes(p,kind){let s=p['推奨滞在時間_分']||'';let m=s.match(/(\d+)\s*[-〜]\s*(\d+)/);let v=m?Math.round((+m[1]+ +m[2])/2):kind==='landmark'?40:kind==='lunch'?50:30;if(kind==='snack')v=Math.min(35,Math.max(25,v));if(kind==='lunch')v=Math.min(65,Math.max(45,v));if(kind==='landmark')v=Math.min(55,Math.max(25,v));return v}
function foodCandidates(kind,target){return P.filter(p=>p.latitude&&p.longitude&&p['種別']==='飲食店'&&openAt(p,target)&&((kind==='snack'&&p['おやつ向き']==='○')||(kind==='lunch'&&p['昼食向き']==='○')))}
function rankFood(list,from,to,random,used){let ranked=list.filter(p=>!used.has(p.place_id)).map(p=>{let pt=pointOf(p);return {p,score:walk(from,pt)+walk(pt,to)-(+(p['Google評価']||0)*2)}}).sort((a,b)=>a.score-b.score);if(!ranked.length)return null;let top=ranked.slice(0,Math.min(5,ranked.length));return random?top[Math.floor(Math.random()*top.length)].p:top[0].p}
function chooseLandmark(from,to,windowMin,random,used){let ranked=P.filter(p=>p.latitude&&p.longitude&&p['種別']==='ランドマーク'&&!used.has(p.place_id)&&openAt(p,tm(lu.value)+70)).map(p=>{let pt=pointOf(p),stay=stayMinutes(p,'landmark'),a=walk(from,pt),b=walk(pt,to),total=a+stay+b;return {p,stay,a,b,total,score:total}}).filter(x=>x.total<=windowMin).sort((a,b)=>a.score-b.score);if(!ranked.length)return null;let top=ranked.slice(0,Math.min(6,ranked.length));return random?top[Math.floor(Math.random()*top.length)]:top[0]}

function addBlock(arr,type,start,end,name,meta,pt){if(end<=start)end=start+1;arr.push({type,start,end,name,meta,pt})}
function addTravel(arr,cur,curT,dest){let mv=walk(cur,dest);addBlock(arr,'travel',curT,curT+mv,'徒歩 約'+mv+'分',cur.name+' → '+dest.name,dest);return curT+mv}
function addFlex(arr,start,end,label='自由時間・散策'){if(end-start>=5)addBlock(arr,'flex',start,end,label,(end-start)+'分の余裕時間',null)}

function plan(random){
  if(!points.s||!points.e){alert('STARTとGOALを設定してください');return}
  const startT=tm(st.value),endT=tm(et.value),t1=tm(sn1.value),tl=tm(lu.value),t2=tm(sn2.value),used=new Set();
  if(!(startT<t1&&t1<tl&&tl<t2&&t2<endT)){alert('時刻は START < 10時のおやつ < 昼食 < 15時のおやつ < GOAL の順に設定してください');return}
  const s1=rankFood(foodCandidates('snack',t1),points.s,points.e,random,used);if(s1)used.add(s1.place_id);
  const from1=s1?pointOf(s1):points.s;
  const lunch=rankFood(foodCandidates('lunch',tl),from1,points.e,random,used);if(lunch)used.add(lunch.place_id);
  const fromLunch=lunch?pointOf(lunch):from1;
  const s2=rankFood(foodCandidates('snack',t2),fromLunch,points.e,random,used);if(s2)used.add(s2.place_id);
  const s2pt=s2?pointOf(s2):points.e;
  const lunchStay=lunch?stayMinutes(lunch,'lunch'):0;
  const landmarkWindow=Math.max(0,t2-(tl+lunchStay));
  const lm=lunch&&s2?chooseLandmark(fromLunch,s2pt,landmarkWindow,random,used):null;
  if(lm)used.add(lm.p.place_id);

  let arr=[],cur={...points.s},curT=startT,late=false,routePts=[[cur.lat,cur.lng]];
  addBlock(arr,'start',startT,Math.min(startT+8,endT),cur.name,'START',cur);

  const addFixedActivity=(p,target,kind,label)=>{
    if(!p){addFlex(arr,curT,target,label+'：候補なし');curT=Math.max(curT,target);return}
    let dest=pointOf(p);curT=addTravel(arr,cur,curT,dest);routePts.push([dest.lat,dest.lng]);
    if(curT<target){addFlex(arr,curT,target);curT=target}
    const stay=stayMinutes(p,kind);addBlock(arr,kind,curT,curT+stay,p['名称'],label+' / '+(p['カテゴリ']||''),dest);curT+=stay;cur={...dest};
  };

  addFixedActivity(s1,t1,'snack','10時のおやつ');
  addFixedActivity(lunch,tl,'lunch','昼食');

  if(lm){let dest=pointOf(lm.p);curT=addTravel(arr,cur,curT,dest);routePts.push([dest.lat,dest.lng]);addBlock(arr,'landmark',curT,curT+lm.stay,lm.p['名称'],'立ち寄り / '+(lm.p['体験・できること']||lm.p['カテゴリ']||''),dest);curT+=lm.stay;cur={...dest}}
  addFixedActivity(s2,t2,'snack','15時のおやつ');

  curT=addTravel(arr,cur,curT,points.e);routePts.push([points.e.lat,points.e.lng]);
  const arrival=curT;if(arrival<=endT){addFlex(arr,arrival,endT,'到着後の余裕');addBlock(arr,'goal',arrival,Math.min(arrival+8,endT),points.e.name,'GOAL / '+ft(arrival)+'到着・'+ft(endT)+'まで',points.e)}else{late=true;addBlock(arr,'late',arrival,arrival+12,points.e.name,'GOAL / '+ft(arrival)+'到着予定（'+(arrival-endT)+'分超過）',points.e)}
  renderPlan(arr,startT,endT,late,routePts,{s1,lunch,s2,lm});
}

function renderPlan(blocks,startT,endT,late,routePts,chosen){
  const ppm=1.35,total=Math.max(360,(endT-startT)*ppm),hours=[];for(let t=Math.ceil(startT/60)*60;t<=endT;t+=60)hours.push(t);
  const lines=hours.map(t=>`<div class="time-label" style="top:${(t-startT)*ppm}px">${ft(t)}</div><div class="hour-line" style="top:${(t-startT)*ppm}px"></div>`).join('');
  const halfs=hours.filter(t=>t+30<endT).map(t=>`<div class="half-line" style="top:${(t+30-startT)*ppm}px"></div>`).join('');
  const bhtml=blocks.map(b=>{let top=(b.start-startT)*ppm,h=Math.max(b.type==='travel'?19:b.type==='start'||b.type==='goal'?22:24,(b.end-b.start)*ppm-2);return `<div class="block ${b.type}" style="top:${top}px;height:${h}px" title="${esc(b.meta)}"><div class="bt">${ft(b.start)}–${ft(b.end)}</div><div class="bn">${esc(b.name)}</div>${h>37?`<div class="bm">${esc(b.meta)}</div>`:''}</div>`}).join('');
  const rows=blocks.filter(b=>!['flex'].includes(b.type)||b.end-b.start>=10).map(b=>`<div class="route-row"><div class="route-time">${ft(b.start)}–${ft(b.end)}</div><div><div class="route-name">${esc(b.name)}</div><div class="muted">${esc(b.meta)}</div></div></div>`).join('');
  let summary=`<span class="pill">${esc(weekday.options[weekday.selectedIndex].text)}</span><span class="pill">${ft(startT)} → ${ft(endT)}</span><span class="pill">徒歩概算</span>`;
  if(chosen.lm)summary+=`<span class="pill">＋α：${esc(chosen.lm.p['名称'])}</span>`;
  result.innerHTML=`<div class="result-title">今日のプラン</div><div class="summary">${summary}</div>${late?'<div class="notice bad">この候補はGOALの終了時刻を超えます。「別プラン」で入れ替えるか、滞在時間・条件の調整が必要です。</div>':'<div class="notice">GOALの終了時刻までの余白も含めて表示しています。ブロックの高さが、そのまま時間の長さです。</div>'}<div class="schedule-wrap"><div class="schedule" style="height:${total}px">${lines}${halfs}<div class="lane" style="height:${total}px">${bhtml}</div></div></div><div class="legend"><span><i style="background:#fff0d9"></i>おやつ</span><span><i style="background:#e5f3eb"></i>昼食</span><span><i style="background:#e7eef9"></i>ランドマーク</span><span><i style="background:#f0f2f4"></i>移動</span><span><i style="background:#fafbfb;border:1px solid #ddd"></i>余裕時間</span></div><div class="route-list">${rows}</div>`;
  if(routeLine)map.removeLayer(routeLine);routeLine=L.polyline(routePts,{weight:4,opacity:.65}).addTo(map);try{map.fitBounds(routeLine.getBounds().pad(.18))}catch(e){}
}

function cacheKey(p){return 'geo:'+p['住所']}function exactKey(p){return 'gmap-pin:'+p.place_id}
function applyCache(){for(const p of P){try{let ex=JSON.parse(localStorage.getItem(exactKey(p)));if(ex){p.latitude=ex.lat;p.longitude=ex.lng;p['座標ステータス']='Google実ピン';p['座標情報源']='Google Maps URL';p['GoogleマップURL_確定']=ex.url;continue}}catch(e){}if(!p.latitude&&p['住所']){try{let v=JSON.parse(localStorage.getItem(cacheKey(p)));if(v){p.latitude=v.lat;p.longitude=v.lng;p['座標ステータス']='端末キャッシュ'}}catch(e){}}}}
function rebuild(){
  all=[...P.filter(p=>p.latitude&&p.longitude).map((p,i)=>({name:p['名称'],cat:p['カテゴリ'],lat:+p.latitude,lng:+p.longitude,source:'place',i})),...B.map((p,i)=>({name:p.stop_name,cat:(p.bus_system||'バス')+' バス停',lat:+p.latitude,lng:+p.longitude,source:'bus',i}))];
  for(const id of ['s','e']){let el=document.getElementById(id);el.innerHTML='<option value="">登録地点から選ぶ</option>'+all.map((p,i)=>`<option value="${i}">${esc(p.name)} — ${esc(p.cat)}</option>`).join('');el.onchange=()=>{let p=all[+el.value];if(p)setPoint(id,p.lat,p.lng,p.name)}}
  placeLayer.clearLayers();P.filter(p=>p.latitude&&p.longitude).forEach(p=>L.circleMarker([+p.latitude,+p.longitude],{radius:p['種別']==='交通'?8:6,weight:p['座標ステータス']==='Google実ピン'?3:1,fillOpacity:.65}).addTo(placeLayer).bindPopup(`<b>${esc(p['名称'])}</b><br>${esc(p['カテゴリ'])}<br><small>${esc(p['座標ステータス']||'')}</small>`));
  busLayer.clearLayers();B.forEach(p=>L.circleMarker([+p.latitude,+p.longitude],{radius:3,weight:1,opacity:.45,fillOpacity:.28}).addTo(busLayer).bindPopup(`<b>${esc(p.stop_name)}</b><br>${esc(p.bus_system||'バス停')}`));
  gmPlace.innerHTML=P.map((p,i)=>`<option value="${i}">${esc(p['名称'])} — ${esc(p['座標ステータス']||'')}</option>`).join('');
  status.textContent=`Places ${P.length}件（座標あり ${P.filter(p=>p.latitude&&p.longitude).length}件） / バス停 ${B.length}地点`;
}
async function geocodeMissing(){let targets=P.filter(p=>!p.latitude&&p['住所']);geoStatus.textContent=`${targets.length}件を処理します…`;let done=0,fail=0;for(const p of targets){try{let q=(p['住所']||'').replace(/^〒\d{3}-\d{4}\s*/,'');let r=await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(q));let j=await r.json();if(j&&j[0]&&j[0].geometry){let [lng,lat]=j[0].geometry.coordinates;p.latitude=lat;p.longitude=lng;p['座標ステータス']='住所検索';p['座標情報源']='国土地理院住所検索';localStorage.setItem(cacheKey(p),JSON.stringify({lat,lng}));done++}else fail++}catch(e){fail++}geoStatus.textContent=`取得 ${done} / 失敗 ${fail} / 残り ${targets.length-done-fail}`;await new Promise(r=>setTimeout(r,110))}rebuild();geoStatus.innerHTML=`<span class="status-ok">完了：${done}件取得</span> / ${fail}件未取得`}
function parseGoogleCoords(url){let m=String(url).match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);if(m)return {lat:+m[1],lng:+m[2]};m=String(url).match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);if(m)return {lat:+m[1],lng:+m[2]};return null}
function applyGooglePin(){let p=P[+gmPlace.value],url=gmUrl.value.trim(),c=parseGoogleCoords(url);if(!p||!c){gmStatus.textContent='URLから実ピン座標を読み取れませんでした。';return}p.latitude=c.lat;p.longitude=c.lng;p['座標ステータス']='Google実ピン';p['座標情報源']='Google Maps URL';p['GoogleマップURL_確定']=url;localStorage.setItem(exactKey(p),JSON.stringify({lat:c.lat,lng:c.lng,url}));gmStatus.textContent=`${p['名称']} → ${c.lat.toFixed(6)}, ${c.lng.toFixed(6)} に補正しました。`;rebuild();map.setView([c.lat,c.lng],17)}
function openSelectedGoogle(){let p=P[+gmPlace.value];if(!p)return;window.open(p['GoogleマップURL_確定']||p['Googleマップ検索URL']||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p['名称']+' 下諏訪町')),'_blank')}
function csvCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replaceAll('"','""')+'"':v}
function exportPlacesCsv(){if(!P.length)return;let keys=Object.keys(P[0]);let text='\ufeff'+keys.map(csvCell).join(',')+'\n'+P.map(p=>keys.map(k=>csvCell(p[k])).join(',')).join('\n');let blob=new Blob([text],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shimosuwa_places_corrected.csv';a.click();URL.revokeObjectURL(a.href)}

Promise.all([
  fetch('data/places.csv').then(r=>{if(!r.ok)throw new Error('places.csv '+r.status);return r.text()}),
  fetch('https://raw.githubusercontent.com/sususunosusumu/SHIMOSUWA-LAB/main/GIS/shimosuwa_bus_stops_combined_raw.json').then(r=>{if(!r.ok)throw new Error('bus stops '+r.status);return r.json()})
]).then(([t,b])=>{P=parseCSV(t);B=b.items||[];applyCache();rebuild();let station=P.find(p=>p['名称']==='下諏訪駅'&&p.latitude);if(station){let idx=all.findIndex(x=>x.name==='下諏訪駅'&&x.source==='place');if(idx>=0){e.value=idx;setPoint('e',+station.latitude,+station.longitude,station['名称'])}}}).catch(e=>{status.textContent='データ読込エラー: '+e.message});

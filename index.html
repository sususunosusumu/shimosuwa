<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下諏訪 時間プランナー v3.2</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#f5f6f4;color:#1f2933}.w{max-width:1050px;margin:auto;padding:16px}.p{background:#fff;border:1px solid #d8dde3;border-radius:16px;padding:16px;margin:14px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{display:block;font-size:13px;color:#667085;margin-bottom:5px}select,input,button{font:inherit;padding:10px;border-radius:10px}select,input{width:100%;border:1px solid #ccd3da}button{border:0;background:#245e52;color:#fff;font-weight:700;cursor:pointer;margin:5px 4px 0 0}button.alt{background:#e8ecef;color:#263238}.warn{background:#fff4d8;color:#674d00}#map{height:420px;border-radius:14px}.small{font-size:13px;color:#667085}.timeline{border-left:3px solid #d8dde3;margin-left:10px;padding-left:18px}.step{position:relative;padding:8px 0 16px}.step:before{content:'';position:absolute;left:-25px;top:12px;width:11px;height:11px;background:#245e52;border-radius:50%}.step b{font-size:16px}.muted{color:#667085;font-size:13px}.tag{display:inline-block;background:#eef5f2;padding:3px 7px;border-radius:999px;font-size:12px;margin:3px 4px 0 0}@media(max-width:700px){.g,.g3{grid-template-columns:1fr}#map{height:340px}}</style></head><body><div class="w"><h1>下諏訪 時間プランナー v3.2</h1><div class="small">全Places + 下諏訪駅 + 補正済みGTFSバス停データを統合した試作</div><div class="p g"><div><label>START</label><select id="s"></select><button onclick="gps('s')">現在地GPS</button><button class="alt" onclick="pick='s'">地図から選ぶ</button><div id="sc" class="small">未設定</div></div><div><label>GOAL</label><select id="e"></select><button onclick="gps('e')">現在地GPS</button><button class="alt" onclick="pick='e'">地図から選ぶ</button><div id="ec" class="small">未設定</div></div></div><div class="p g"><div><label>開始時刻</label><input id="st" type="time" value="09:00"></div><div><label>終了時刻</label><input id="et" type="time" value="16:00"></div></div><div class="p g3"><div><label>10時のおやつ</label><input id="sn1" type="time" value="10:00"></div><div><label>昼食</label><input id="lu" type="time" value="12:00"></div><div><label>15時のおやつ</label><input id="sn2" type="time" value="15:00"></div></div><div class="p"><button onclick="plan(false)">プランを作る</button><button class="alt" onclick="plan(true)">別プラン</button><div id="result" style="margin-top:14px" class="small">STARTとGOALを設定してプランを作ってください。</div></div><div class="p"><div id="status" class="small">データ読込中...</div><button class="warn" onclick="geocodeMissing()">未取得座標を自動取得</button><div id="geoStatus" class="small">住所検索は国土地理院の公開住所検索を使用し、取得結果はこの端末にキャッシュします。</div><div id="map"></div></div><div class="p small">各PlaceにはGoogle Maps検索リンクを保持しています。正確な店舗ピンを後で確認できた場合は、その緯度経度でCSVを上書きできます。現時点の徒歩時間は直線距離を徒歩4km/hで概算しています。</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>let P=[],B=[],pick=null,points={s:null,e:null},markers={s:null,e:null},all=[];const m=L.map('map').setView([36.075,138.083],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(m);function csv(t){let a=[],r=[],f='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){f+='"';i++}else q=!q}else if(c===','&&!q){r.push(f);f=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.length>1)a.push(r);r=[]}else f+=c}if(r.length){r.push(f);a.push(r)}let h=a.shift();return a.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||''])))}function set(t,lat,lng,n){points[t]={lat:+lat,lng:+lng,name:n};document.getElementById(t+'c').textContent=n+' / '+(+lat).toFixed(6)+', '+(+lng).toFixed(6);if(markers[t])m.removeLayer(markers[t]);markers[t]=L.marker([lat,lng]).addTo(m).bindPopup(t==='s'?'START':'GOAL').openPopup();m.setView([lat,lng],15)}function gps(t){navigator.geolocation.getCurrentPosition(p=>set(t,p.coords.latitude,p.coords.longitude,'現在地'),()=>alert('位置情報を取得できませんでした'))}m.on('click',x=>{if(pick){set(pick,x.latlng.lat,x.latlng.lng,'地図で選択');pick=null}});function d(a,b){const R=6371,rad=x=>x*Math.PI/180,dp=rad(b.lat-a.lat),dl=rad(b.lng-a.lng),q=Math.sin(dp/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function walk(a,b){return Math.max(3,Math.round(d(a,b)/4*60*1.15))}function tm(s){let[h,m]=s.split(':').map(Number);return h*60+m}function ft(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function openAt(p,min){let h=p['営業時間']||'';if(!h)return true;let ranges=[...h.matchAll(/(\d{1,2}):(\d{2})\s*[-〜]\s*(\d{1,2}):(\d{2})/g)];if(!ranges.length)return true;return ranges.some(x=>{let a=+x[1]*60 + +x[2],b=+x[3]*60 + +x[4];if(b===0)b=1440;return min>=a&&min<=b})}function candidates(kind,min){return P.filter(p=>p.latitude&&p.longitude&&p['種別']==='飲食店'&&openAt(p,min)&&((kind==='snack'&&p['おやつ向き']==='○')||(kind==='lunch'&&p['昼食向き']==='○')))}function choose(list,from,to,random){let s=list.map(p=>({p,score:walk(from,{lat:+p.latitude,lng:+p.longitude})+walk({lat:+p.latitude,lng:+p.longitude},to)-(+(p['Google評価']||0)*2)})).sort((a,b)=>a.score-b.score);if(!s.length)return null;let top=s.slice(0,Math.min(4,s.length));return random?top[Math.floor(Math.random()*top.length)].p:top[0].p}function plan(random){if(!points.s||!points.e){alert('STARTとGOALを設定してください');return}let events=[['snack',tm(sn1.value),'10時のおやつ'],['lunch',tm(lu.value),'昼食'],['snack',tm(sn2.value),'15時のおやつ']],used=new Set(),cur=points.s,curT=tm(st.value),out=[{t:ft(curT),n:points.s.name,meta:'START'}];for(const [kind,target,label] of events){let c=candidates(kind,target).filter(x=>!used.has(x.place_id)),p=choose(c,cur,points.e,random);if(!p){out.push({t:ft(target),n:label+'：候補なし',meta:'座標・用途・営業時間の条件に合う候補がありません'});continue}let dest={lat:+p.latitude,lng:+p.longitude},mv=walk(cur,dest),arr=Math.max(target,curT+mv),stay=kind==='lunch'?50:30;out.push({t:ft(curT)+'→'+ft(arr),n:'徒歩 約'+mv+'分',meta:cur.name+' → '+p['名称']});out.push({t:ft(arr)+'–'+ft(arr+stay),n:p['名称'],meta:label+' / '+(p['カテゴリ']||'')});used.add(p.place_id);cur={...dest,name:p['名称']};curT=arr+stay}let mv=walk(cur,points.e),end=tm(et.value);out.push({t:ft(curT)+'→'+ft(curT+mv),n:'徒歩 約'+mv+'分',meta:cur.name+' → '+points.e.name});out.push({t:ft(end),n:points.e.name,meta:(curT+mv<=end?'GOAL（終了時刻までに到着可能）':'GOAL（終了時刻超過：要調整）')});result.innerHTML='<div class="timeline">'+out.map(x=>'<div class="step"><b>'+x.t+' '+x.n+'</b><div class="muted">'+x.meta+'</div></div>').join('')+'</div>'}function cacheKey(p){return 'geo:'+p['住所']}function applyCache(){for(const p of P){if(!p.latitude&&p['住所']){try{let v=JSON.parse(localStorage.getItem(cacheKey(p)));if(v){p.latitude=v.lat;p.longitude=v.lng;p['座標ステータス']='端末キャッシュ'}}catch(e){}}}}function rebuild(){all=[...P.filter(p=>p.latitude).map((p,i)=>({name:p['名称'],cat:p['カテゴリ'],lat:+p.latitude,lng:+p.longitude,source:'place',i})),...B.map((p,i)=>({name:p.stop_name,cat:p.bus_system+' バス停',lat:+p.latitude,lng:+p.longitude,source:'bus',i}))];for(const id of ['s','e']){let el=document.getElementById(id);el.innerHTML='<option value="">登録地点から選ぶ</option>'+all.map((p,i)=>'<option value="'+i+'">'+p.name+' — '+p.cat+'</option>').join('');el.onchange=()=>{let p=all[+el.value];if(p)set(id,p.lat,p.lng,p.name)}}P.filter(p=>p.latitude&&!p._drawn).forEach(p=>{p._drawn=1;L.circleMarker([+p.latitude,+p.longitude],{radius:p['種別']==='交通'?8:6}).addTo(m).bindPopup('<b>'+p['名称']+'</b><br>'+p['カテゴリ']+'<br><a target="_blank" href="'+(p['Googleマップ検索URL']||'#')+'">Google Maps</a>')});status.textContent='Places '+P.length+'件（座標あり '+P.filter(p=>p.latitude).length+' / 未取得 '+P.filter(p=>!p.latitude).length+'） / バス停 '+B.length+'地点'}async function geocodeMissing(){let miss=P.filter(p=>!p.latitude&&p['住所']);geoStatus.textContent='未取得 '+miss.length+'件を住所検索します…';let ok=0,ng=0;for(let i=0;i<miss.length;i++){let p=miss[i],q=(p['住所']||'').replace(/^〒\d{3}-\d{4}\s*/,'').replace(/付近$/,'');try{let r=await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(q));let j=await r.json();if(j&&j[0]&&j[0].geometry&&j[0].geometry.coordinates){let [lng,lat]=j[0].geometry.coordinates;p.latitude=lat;p.longitude=lng;p['座標ステータス']='住所検索取得';p['座標情報源']='国土地理院住所検索';localStorage.setItem(cacheKey(p),JSON.stringify({lat,lng}));ok++;}else ng++;}catch(e){ng++;}geoStatus.textContent=(i+1)+'/'+miss.length+' 処理中… 成功 '+ok+' / 未取得 '+ng;await new Promise(r=>setTimeout(r,250));}rebuild();geoStatus.textContent='座標取得完了：成功 '+ok+' / 未取得 '+ng+'。取得結果はこの端末に保存しました。'}async function loadCorrectedBusStops(){const url='https://raw.githubusercontent.com/sususunosusumu/SHIMOSUWA-LAB/main/GTFS/shimosuwa_azami_swan_merged_gtfs_v6.zip';const buf=await fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('GTFS ZIPを取得できません');return r.arrayBuffer()});const zip=await JSZip.loadAsync(buf);const txt=await zip.file('stops.txt').async('string');const stops=csv(txt);return stops.filter(s=>String(s.location_source||'').startsWith('real_json')&&s.stop_lat&&s.stop_lon&&!isNaN(+s.stop_lat)&&!isNaN(+s.stop_lon)).map(s=>({stop_name:s.stop_name,latitude:+s.stop_lat,longitude:+s.stop_lon,bus_system:String(s.stop_id||'').startsWith('AZAMI_')?'あざみ号':'スワンバス',source:'GTFS補正済みWGS84'}));}Promise.all([fetch('data/places.csv').then(r=>r.text()),loadCorrectedBusStops()]).then(([t,b])=>{P=csv(t);B=b;applyCache();rebuild();B.forEach(p=>L.circleMarker([+p.latitude,+p.longitude],{radius:3,weight:1,opacity:.5,fillOpacity:.25}).addTo(m).bindPopup('<b>'+p.stop_name+'</b><br>'+p.bus_system+'<br><small>補正済み座標</small>'));geoStatus.textContent=(geoStatus.textContent||'')+' / バス停は日本測地系→WGS84補正済みGTFS座標を使用';}).catch(e=>{status.textContent='データ読込エラー: '+e.message});</script></body></html>

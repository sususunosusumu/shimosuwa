<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下諏訪 時間プランナー</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--main:#245e52;--ink:#1f2933;--muted:#667085;--bg:#f4f6f4;--line:#dce2e5;--panel:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.w{max-width:1080px;margin:auto;padding:15px}.top,.head,.row,.palette,.sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.top,.head{justify-content:space-between}.top h1{margin:0;font-size:27px}.sub,.sm{color:var(--muted);font-size:12px;line-height:1.55}.ver{padding:5px 9px;border-radius:999px;background:#e7f1ed;color:#184b40;font-size:12px;font-weight:800}.p{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin:13px 0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}select,input,button{font:inherit;padding:9px;border-radius:9px}select,input{width:100%;background:#fff;border:1px solid #ccd4da}button{border:0;background:var(--main);color:#fff;font-weight:800;cursor:pointer}button.alt{background:#edf0f2;color:#34434f}.palette button{background:#eef4f1;color:#245e52;border:1px solid #d8e7e0}.wishlist,.plan{display:grid;gap:9px;margin-top:11px}.wish{display:grid;grid-template-columns:32px 1.15fr .7fr .65fr 1.2fr auto;gap:7px;align-items:end;border:1px solid var(--line);border-radius:13px;padding:10px;background:#fbfcfc}.num{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#e7f1ed;color:#245e52;font-weight:900;align-self:center}.ctrl{display:flex;gap:4px;align-self:center}.ctrl button{padding:6px 8px}.card{display:grid;grid-template-columns:88px 1fr;gap:9px;border:1px solid #dfe4e7;border-radius:13px;padding:11px}.card.travel{background:#f7f8f9;border-style:dashed}.card.warn{background:#fff3f3;border-color:#efcaca}.time{font-weight:900}.name{font-size:15px;font-weight:900}.meta{font-size:12px;color:var(--muted);margin-top:3px}.tag,.pill{display:inline-block;background:#eef2f2;border-radius:999px;padding:4px 7px;font-size:11px;color:#52606b;margin:4px 4px 0 0}.diagnostic{margin-top:6px;font-size:11px;color:#805b18;background:#fff8e5;border-radius:8px;padding:7px}.ep{border:1px solid #e0e5e8;border-radius:12px;padding:11px}#map{height:390px;border-radius:13px;margin-top:8px}.link{color:#245e52;text-decoration:none;font-weight:800}.toggle{display:flex;gap:6px;align-items:center}.toggle input{width:auto}.star{color:#996a00;font-weight:800}@media(max-width:780px){.g2,.g4{grid-template-columns:1fr}.wish{grid-template-columns:30px 1fr 1fr}.wish .wide{grid-column:2/4}.ctrl{grid-column:2/4;justify-content:flex-end}.card{grid-template-columns:72px 1fr}#map{height:330px}.w{padding:11px}}
</style></head><body><div class="w"><div class="top"><div><h1>下諏訪 時間プランナー</h1><div class="sub">やりたいことを積むと、STARTからGOALまでの時間内で過ごし方を組み立てます。</div></div><div><span class="ver">planner rebuild 1.2</span> <a class="link" href="maintenance.html">地点データ管理 →</a></div></div>
<div class="p g2"><div class="ep"><label>START</label><select id="ss"></select><div class="row"><button onclick="gps('s')">現在地GPS</button><button class="alt" onclick="pick='s'">地図から選ぶ</button></div><div id="sc" class="sm">未設定</div></div><div class="ep"><label>GOAL</label><select id="gs"></select><div class="row"><button onclick="gps('g')">現在地GPS</button><button class="alt" onclick="pick='g'">地図から選ぶ</button></div><div id="gc" class="sm">未設定</div></div></div>
<div class="p g4"><div><label>曜日</label><select id="wd"><option value="月">月曜日</option><option value="火">火曜日</option><option value="水">水曜日</option><option value="木">木曜日</option><option value="金">金曜日</option><option value="土">土曜日</option><option value="日">日曜日</option></select></div><div><label>開始時刻</label><input id="st" type="time" value="09:00"></div><div><label>終了時刻</label><input id="et" type="time" value="16:00"></div><div><label>プラン方針</label><select id="policy"><option value="balanced">バランス</option><option value="recommended">おすすめ重視</option><option value="near">移動少なめ</option></select></div></div>
<div class="p"><div class="row"><label class="toggle"><input id="rain" type="checkbox"> 雨の日向きを優先</label><label class="toggle"><input id="senior" type="checkbox"> 高齢者向きを優先</label><label class="toggle"><input id="allowConditional" type="checkbox"> 条件付きPlaceも候補に含める</label></div></div>
<div class="p"><div class="head"><div><b>やりたいこと</b><div class="sm">希望時刻と具体的な場所は任意です。</div></div><span id="wc" class="sm"></span></div><div class="palette"><button onclick="addWish('snack')">＋おやつ</button><button onclick="addWish('lunch')">＋昼食</button><button onclick="addWish('landmark')">＋観光</button><button onclick="addWish('onsen')">＋温泉</button><button onclick="addWish('cafe')">＋カフェ</button><button onclick="addWish('park')">＋公園・散歩</button><button onclick="addWish('rest')">＋休憩</button><button onclick="addWish('free')">＋自由時間</button></div><div id="wl" class="wishlist"></div><div class="row" style="margin-top:11px"><button onclick="plan(false)">この希望でプランを作る</button><button class="alt" onclick="plan(true)">別プラン</button><button class="alt" onclick="sample()">サンプルに戻す</button></div></div>
<div class="p"><div class="head"><b>提案プラン</b><span id="ps" class="sm">未作成</span></div><div id="summary" class="sum"></div><div id="result" class="plan"><div class="sm">STARTを設定してください。GOALは下諏訪駅を初期選択します。</div></div></div>
<div class="p"><div class="head"><b>地図</b><span id="status" class="sm">読込中...</span></div><div id="map"></div><div class="sm" style="margin-top:7px">青＝バス停、赤＝トイレ、緑＝店舗・飲食、橙＝ランドマーク。現在の徒歩時間は直線距離を補正した試算です。</div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="place-data.js?v=20260829-2"></script><script src="planner-app.js?v=20260829-2"></script><script src="place-guide.js?v=20260829-2"></script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下諏訪 時間プランナー v3</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#f5f6f4;color:#1f2933}.w{max-width:1050px;margin:auto;padding:16px}.p{background:#fff;border:1px solid #d8dde3;border-radius:16px;padding:16px;margin:14px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{display:block;font-size:13px;color:#667085;margin-bottom:5px}select,input,button{font:inherit;padding:10px;border-radius:10px}select,input{width:100%;border:1px solid #ccd3da}button{border:0;background:#245e52;color:#fff;font-weight:700;cursor:pointer;margin:5px 4px 0 0}button.alt{background:#e8ecef;color:#263238}#map{height:400px;border-radius:14px}.small{font-size:13px;color:#667085}.timeline{border-left:3px solid #d8dde3;margin-left:10px;padding-left:18px}.step{position:relative;padding:8px 0 16px}.step:before{content:'';position:absolute;left:-25px;top:12px;width:11px;height:11px;background:#245e52;border-radius:50%}.step b{font-size:16px}.muted{color:#667085;font-size:13px}.tag{display:inline-block;background:#eef5f2;padding:3px 7px;border-radius:999px;font-size:12px;margin:3px 4px 0 0}@media(max-width:700px){.g,.g3{grid-template-columns:1fr}#map{height:330px}}</style></head><body><div class="w"><h1>下諏訪 時間プランナー v3</h1><div class="small">Places + 下諏訪駅 + 既存GISバス停データを統合した試作</div><div class="p g"><div><label>START</label><select id="s"></select><button onclick="gps('s')">現在地GPS</button><button class="alt" onclick="pick='s'">地図から選ぶ</button><div id="sc" class="small">未設定</div></div><div><label>GOAL</label><select id="e"></select><button onclick="gps('e')">現在地GPS</button><button class="alt" onclick="pick='e'">地図から選ぶ</button><div id="ec" class="small">未設定</div></div></div><div class="p g"><div><label>開始時刻</label><input id="st" type="time" value="09:00"></div><div><label>終了時刻</label><input id="et" type="time" value="16:00"></div></div><div class="p g3"><div><label>10時のおやつ</label><input id="sn1" type="time" value="10:00"></div><div><label>昼食</label><input id="lu" type="time" value="12:00"></div><div><label>15時のおやつ</label><input id="sn2" type="time" value="15:00"></div></div><div class="p"><button onclick="plan(false)">プランを作る</button><button class="alt" onclick="plan(true)">別プラン</button><div id="result" style="margin-top:14px" class="small">STARTとGOALを設定してプランを作ってください。</div></div><div class="p"><div id="status" class="small">データ読込中...</div><div id="map"></div></div><div class="p small">バス停は既存の SHIMOSUWA-LAB / GIS の「あざみ号・スワンバス」統合データを直接読み込みます。現時点の移動時間は直線距離を徒歩速度4km/hで概算しています。バス時刻表そのものは次段階で接続します。</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>let P=[],B=[],pick=null,points={s:null,e:null},markers={s:null,e:null};const m=L.map('map').setView([36.075,138.083],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(m);function csv(t){let a=[],r=[],f='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){f+='"';i++}else q=!q}else if(c===','&&!q){r.push(f);f=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.length>1)a.push(r);r=[]}else f+=c}if(r.length){r.push(f);a.push(r)}let h=a.shift();return a.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||''])))}function set(t,lat,lng,n){points[t]={lat:+lat,lng:+lng,name:n};document.getElementById(t+'c').textContent=n+' / '+(+lat).toFixed(6)+', '+(+lng).toFixed(6);if(markers[t])m.removeLayer(markers[t]);markers[t]=L.marker([lat,lng]).addTo(m).bindPopup(t==='s'?'START':'GOAL').openPopup();m.setView([lat,lng],15)}function gps(t){navigator.geolocation.getCurrentPosition(p=>set(t,p.coords.latitude,p.coords.longitude,'現在地'),()=>alert('位置情報を取得できませんでした'))}m.on('click',x=>{if(pick){set(pick,x.latlng.lat,x.latlng.lng,'地図で選択');pick=null}});function d(a,b){const R=6371,rad=x=>x*Math.PI/180,dp=rad(b.lat-a.lat),dl=rad(b.lng-a.lng),q=Math.sin(dp/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function walk(a,b){return Math.max(3,Math.round(d(a,b)/4*60*1.15))}function tm(s){let[h,m]=s.split(':').map(Number);return h*60+m}function ft(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function openAt(p,min){let h=p['営業時間']||'';if(!h)return true;let ranges=[...h.matchAll(/(\d{1,2}):(\d{2})\s*[-〜]\s*(\d{1,2}):(\d{2})/g)];if(!ranges.length)return true;return ranges.some(x=>{let a=+x[1]*60 + +x[2],b=+x[3]*60 + +x[4];if(b===0)b=1440;return min>=a&&min<=b})}function candidates(kind,min){return P.filter(p=>p.latitude&&p.longitude&&p['種別']==='飲食店'&&openAt(p,min)&&((kind==='snack'&&p['おやつ向き']==='○')||(kind==='lunch'&&p['昼食向き']==='○')))}function choose(list,from,to,random){let s=list.map(p=>({p,score:walk(from,{lat:+p.latitude,lng:+p.longitude})+walk({lat:+p.latitude,lng:+p.longitude},to)-(+(p['Google評価']||0)*2)})).sort((a,b)=>a.score-b.score);if(!s.length)return null;let top=s.slice(0,Math.min(4,s.length));return random?top[Math.floor(Math.random()*top.length)].p:top[0].p}function plan(random){if(!points.s||!points.e){alert('STARTとGOALを設定してください');return}let events=[['snack',tm(sn1.value),'10時のおやつ'],['lunch',tm(lu.value),'昼食'],['snack',tm(sn2.value),'15時のおやつ']],used=new Set(),cur=points.s,curT=tm(st.value),out=[];out.push({t:ft(curT),n:points.s.name,meta:'START'});for(const [kind,target,label] of events){let c=candidates(kind,target).filter(x=>!used.has(x.place_id)),p=choose(c,cur,points.e,random);if(!p){out.push({t:ft(target),n:label+'：候補なし',meta:'現在の座標付きPlacesデータでは候補がありません'});continue}let dest={lat:+p.latitude,lng:+p.longitude},mv=walk(cur,dest),arr=Math.max(target,curT+mv),stay=kind==='lunch'?50:30;out.push({t:ft(curT)+'→'+ft(arr),n:'徒歩 約'+mv+'分',meta:cur.name+' → '+p['名称']});out.push({t:ft(arr)+'–'+ft(arr+stay),n:p['名称'],meta:label+' / '+(p['カテゴリ']||'')});used.add(p.place_id);cur={...dest,name:p['名称']};curT=arr+stay}let mv=walk(cur,points.e),end=tm(et.value);out.push({t:ft(curT)+'→'+ft(curT+mv),n:'徒歩 約'+mv+'分',meta:cur.name+' → '+points.e.name});out.push({t:ft(end),n:points.e.name,meta:(curT+mv<=end?'GOAL（終了時刻までに到着可能）':'GOAL（終了時刻超過：要調整）')});result.innerHTML='<div class="timeline">'+out.map(x=>'<div class="step"><b>'+x.t+' '+x.n+'</b><div class="muted">'+x.meta+'</div></div>').join('')+'</div>'}Promise.all([fetch('data/places.csv').then(r=>r.text()),fetch('https://raw.githubusercontent.com/sususunosusumu/SHIMOSUWA-LAB/main/GIS/shimosuwa_bus_stops_combined_raw.json').then(r=>r.json())]).then(([t,b])=>{P=csv(t);B=b.items||[];const station={name:'下諏訪駅',cat:'鉄道駅',lat:36.071948,lng:138.084953,source:'station'};const all=[station,...P.filter(p=>p.latitude).map((p,i)=>({name:p['名称'],cat:p['カテゴリ'],lat:+p.latitude,lng:+p.longitude,source:'place',i})),...B.map((p,i)=>({name:p.stop_name,cat:p.bus_system+' バス停',lat:+p.latitude,lng:+p.longitude,source:'bus',i}))];for(const id of ['s','e']){let el=document.getElementById(id);el.innerHTML='<option value="">登録地点から選ぶ</option>'+all.map((p,i)=>'<option value="'+i+'">'+p.name+' — '+p.cat+'</option>').join('');el.onchange=()=>{let p=all[+el.value];if(p)set(id,p.lat,p.lng,p.name)}}L.circleMarker([station.lat,station.lng],{radius:8,weight:3}).addTo(m).bindPopup('<b>下諏訪駅</b><br>JR中央本線 / 交通ハブ');P.filter(p=>p.latitude).forEach(p=>L.circleMarker([+p.latitude,+p.longitude],{radius:6}).addTo(m).bindPopup('<b>'+p['名称']+'</b><br>'+p['カテゴリ']));B.forEach(p=>L.circleMarker([+p.latitude,+p.longitude],{radius:3,weight:1,opacity:.55,fillOpacity:.35}).addTo(m).bindPopup('<b>'+p.stop_name+'</b><br>'+p.bus_system));status.textContent='Places '+P.length+'件 / バス停 '+B.length+'地点 / 下諏訪駅を読み込みました';}).catch(e=>{status.textContent='データ読込エラー: '+e.message});</script></body></html>

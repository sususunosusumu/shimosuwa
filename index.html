<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下諏訪 時間プランナー</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#f5f6f4;color:#1f2933}.w{max-width:1000px;margin:auto;padding:18px}.p{background:#fff;border:1px solid #d8dde3;border-radius:16px;padding:16px;margin:14px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;color:#667085;margin-bottom:5px}select,input,button{font:inherit;padding:10px;border-radius:10px}select,input{width:100%;border:1px solid #ccd3da}button{border:0;background:#245e52;color:white;font-weight:700;cursor:pointer;margin:5px 4px 0 0}button.alt{background:#e8ecef;color:#263238}#map{height:430px;border-radius:14px}.small{font-size:13px;color:#667085}@media(max-width:650px){.g{grid-template-columns:1fr}#map{height:350px}}</style></head><body><div class="w"><h1>下諏訪 時間プランナー</h1><div class="small">GitHub prototype — START / GOAL をPlace・GPS・地図から選ぶ</div><div class="p g"><div><label>START</label><select id="s"></select><button onclick="gps('s')">現在地GPS</button><button class="alt" onclick="pick='s'">地図から選ぶ</button><div id="sc" class="small">未設定</div></div><div><label>GOAL</label><select id="e"></select><button onclick="gps('e')">現在地GPS</button><button class="alt" onclick="pick='e'">地図から選ぶ</button><div id="ec" class="small">未設定</div></div></div><div class="p g"><div><label>開始時刻</label><input type="time" value="09:00"></div><div><label>終了時刻</label><input type="time" value="16:00"></div></div><div class="p"><div id="status" class="small">Places読込中...</div><div id="map"></div></div><div class="p small">現在は地図とSTART/GOAL選択のテスト版です。次に全Places座標、食事条件、徒歩ルート、あざみ号、イベントを接続します。</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>let P=[],pick=null,sm=null,em=null;const m=L.map('map').setView([36.075,138.083],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(m);function csv(t){let a=[],r=[],f='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){q=!q}else if(c===','&&!q){r.push(f);f=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.length>1)a.push(r);r=[]}else f+=c}let h=a.shift();return a.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||''])))}function set(t,lat,lng,n){document.getElementById(t+'c').textContent=n+' / '+lat.toFixed(6)+', '+lng.toFixed(6);if(t==='s'){if(sm)m.removeLayer(sm);sm=L.marker([lat,lng]).addTo(m).bindPopup('START').openPopup()}else{if(em)m.removeLayer(em);em=L.marker([lat,lng]).addTo(m).bindPopup('GOAL').openPopup()}m.setView([lat,lng],15)}function gps(t){navigator.geolocation.getCurrentPosition(p=>set(t,p.coords.latitude,p.coords.longitude,'現在地'),()=>alert('位置情報を取得できませんでした'))}m.on('click',x=>{if(pick){set(pick,x.latlng.lat,x.latlng.lng,'地図で選択');pick=null}});fetch('data/places.csv').then(r=>r.text()).then(t=>{P=csv(t);for(const id of ['s','e']){const el=document.getElementById(id);el.innerHTML='<option value="">登録Placeから選ぶ</option>'+P.map((p,i)=>'<option value="'+i+'">'+p['名称']+' — '+p['カテゴリ']+'</option>').join('');el.onchange=()=>{let p=P[+el.value];if(p&&p.latitude)set(id,+p.latitude,+p.longitude,p['名称'])}}P.filter(p=>p.latitude).forEach(p=>L.circleMarker([+p.latitude,+p.longitude],{radius:7}).addTo(m).bindPopup('<b>'+p['名称']+'</b><br>'+p['カテゴリ']));document.getElementById('status').textContent='Places '+P.length+'件をCSVから読み込みました';});</script></body></html>

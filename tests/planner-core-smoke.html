<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Planner Core Smoke Test</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;max-width:900px;margin:30px auto;padding:0 16px}
.ok{color:#087f23}.ng{color:#b42318}pre{background:#f5f5f5;padding:12px;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Planner Core Smoke Test</h1>
<div id="out"></div>
<script src="../planner-core.js"></script>
<script>
(() => {
  const rows=[];
  function test(name, fn){
    try{
      const ok=!!fn();
      rows.push({name,ok});
    }catch(e){
      rows.push({name,ok:false,error:String(e&&e.stack||e)});
    }
  }

  test('昼食は11:30より前にならない',()=>{
    const w=PlannerCore.Time.timeWindowFor({type:'lunch'},0,0,9*60,16*60);
    return w.min===11*60+30 && w.max===13*60+30;
  });

  test('おやつ1回は15時前後',()=>{
    const w=PlannerCore.Time.timeWindowFor({type:'snack'},0,1,9*60,16*60);
    return w.target===15*60;
  });

  test('おやつ2回の1回目は午前',()=>{
    const w=PlannerCore.Time.timeWindowFor({type:'snack'},0,2,9*60,16*60);
    return w.target===10*60+15;
  });

  test('行く価値2は自動候補から除外',()=>{
    return PlannerCore.PlacePolicy.isAutoCandidate({visitValue:2,autoLevel:'normal'})===false;
  });

  test('行く価値2も直接指定なら利用可能',()=>{
    return PlannerCore.PlacePolicy.isAutoCandidate({visitValue:2,autoLevel:'normal'},{explicit:true})===true;
  });

  test('短い待ちは直前の柔軟Placeへ吸収',()=>{
    const input=[
      {type:'act',wishType:'park',from:10*60+55,to:11*60+15,flexible:true},
      {type:'travel',from:11*60+15,to:11*60+17},
      {type:'wait',from:11*60+17,to:11*60+30,fixedTransport:false},
      {type:'act',wishType:'lunch',from:11*60+30,to:12*60+20}
    ];
    const out=PlannerCore.GapOptimizer.absorbShortGaps(input);
    return out.length===3 &&
      out[0].to===11*60+28 &&
      out[1].from===11*60+28 &&
      out[1].to===11*60+30;
  });

  test('バス待ちは吸収しない',()=>{
    const input=[
      {type:'act',wishType:'park',from:10*60,to:10*60+30,flexible:true},
      {type:'travel',from:10*60+30,to:10*60+35},
      {type:'wait',from:10*60+35,to:10*60+43,fixedTransport:true}
    ];
    return PlannerCore.GapOptimizer.absorbShortGaps(input).length===3;
  });

  const ok=rows.filter(x=>x.ok).length;
  document.getElementById('out').innerHTML=
    '<p><b>'+ok+' / '+rows.length+' passed</b></p>'+
    rows.map(x=>'<div class="'+(x.ok?'ok':'ng')+'">'+(x.ok?'✓':'✗')+' '+x.name+(x.error?'<pre>'+x.error+'</pre>':'')+'</div>').join('');
})();
</script>
</body>
</html>

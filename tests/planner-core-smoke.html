<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Planner Core Smoke Test</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;max-width:900px;margin:30px auto;padding:0 16px}
.ok{color:#087f23}.ng{color:#b42318}pre{background:#f5f5f5;padding:12px;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Planner Core Smoke Test</h1>
<div id="out"></div>
<script src="../planner-core.js"></script>
<script>
(() => {
  const rows=[];
  function test(name, fn){
    try{
      const ok=!!fn();
      rows.push({name,ok});
    }catch(e){
      rows.push({name,ok:false,error:String(e&&e.stack||e)});
    }
  }

  test('昼食は11:30より前にならない',()=>{
    const w=PlannerCore.Time.timeWindowFor({type:'lunch'},0,0,9*60,16*60);
    return w.min===11*60+30 && w.max===13*60+30;
  });

  test('おやつ1回は15時前後',()=>{
    const w=PlannerCore.Time.timeWindowFor({type:'snack'},0,1,9*60,16*60);
    return w.target===15*60;
  });

  test('おやつ2回の1回目は午前',()=>{
    const w=PlannerCore.Time.timeWindowFor({type:'snack'},0,2,9*60,16*60);
    return w.target===10*60+15;
  });

  test('行く価値2は自動候補から除外',()=>{
    return PlannerCore.PlacePolicy.isAutoCandidate({visitValue:2,autoLevel:'normal'})===false;
  });

  test('行く価値2も直接指定なら利用可能',()=>{
    return PlannerCore.PlacePolicy.isAutoCandidate({visitValue:2,autoLevel:'normal'},{explicit:true})===true;
  });

  test('短い待ちは直前の柔軟Placeへ吸収',()=>{
    const input=[
      {type:'act',wishType:'park',from:10*60+55,to:11*60+15,flexible:true},
      {type:'travel',from:11*60+15,to:11*60+17},
      {type:'wait',from:11*60+17,to:11*60+30,fixedTransport:false},
      {type:'act',wishType:'lunch',from:11*60+30,to:12*60+20}
    ];
    const out=PlannerCore.GapOptimizer.absorbShortGaps(input);
    return out.length===3 &&
      out[0].to===11*60+28 &&
      out[1].from===11*60+28 &&
      out[1].to===11*60+30;
  });


  test('徒歩上限10分を超える徒歩は候補外',()=>{
    const a={lat:36.075,lng:138.083};
    const b={lat:36.090,lng:138.083};
    return PlannerCore.Transport.previewMove('walk',a,b,9*60).then(x=>x===null);
  });

  test('GTFSバス待ち10分以内を採用',()=>{
    const index=PlannerCore.Transport.createGtfsIndex({
      stops:[
        {stop_id:'A',stop_name:'A',stop_lat:'36.075',stop_lon:'138.083'},
        {stop_id:'B',stop_name:'B',stop_lat:'36.080',stop_lon:'138.090'}
      ],
      routes:[{route_id:'R1',route_short_name:'Test'}],
      trips:[{trip_id:'T1',route_id:'R1',service_id:'S1'}],
      stopTimes:[
        {trip_id:'T1',stop_id:'A',stop_sequence:'1',departure_time:'09:08'},
        {trip_id:'T1',stop_id:'B',stop_sequence:'2',arrival_time:'09:18',departure_time:'09:18'}
      ],
      calendar:[{service_id:'S1',monday:'1',tuesday:'1',wednesday:'1',thursday:'1',friday:'1',saturday:'1',sunday:'1'}]
    });
    const from={lat:36.075,lng:138.083},to={lat:36.080,lng:138.090};
    const leg=PlannerCore.Transport.findBusLeg(index,from,to,9*60,'月');
    return leg && leg.wait<=10 && leg.route==='Test';
  });

  test('GTFSバス待ち10分超は採用しない',()=>{
    const index=PlannerCore.Transport.createGtfsIndex({
      stops:[
        {stop_id:'A',stop_name:'A',stop_lat:'36.075',stop_lon:'138.083'},
        {stop_id:'B',stop_name:'B',stop_lat:'36.080',stop_lon:'138.090'}
      ],
      routes:[{route_id:'R1',route_short_name:'Test'}],
      trips:[{trip_id:'T1',route_id:'R1',service_id:'S1'}],
      stopTimes:[
        {trip_id:'T1',stop_id:'A',stop_sequence:'1',departure_time:'09:20'},
        {trip_id:'T1',stop_id:'B',stop_sequence:'2',arrival_time:'09:30',departure_time:'09:30'}
      ],
      calendar:[{service_id:'S1',monday:'1',tuesday:'1',wednesday:'1',thursday:'1',friday:'1',saturday:'1',sunday:'1'}]
    });
    const from={lat:36.075,lng:138.083},to={lat:36.080,lng:138.090};
    return PlannerCore.Transport.findBusLeg(index,from,to,9*60,'月')===null;
  });

  test('PlaceData候補は行く価値3以上だけ',()=>{
    const mockPD={
      effective:(p,n)=>p[n]||'',
      truthy:v=>String(v)==='○',
      keyOf:p=>p.place_id,
      lat:p=>+p.latitude,
      lng:p=>+p.longitude,
      recommendation:p=>+p['おすすめ度'],
      autoLevel:p=>p['自動提案']||'normal'
    };
    const rows=[
      {place_id:'1','名称':'低優先','種別':'飲食店',latitude:'36.075',longitude:'138.083','おすすめ度':'2','自動提案':'normal','昼食向き':'○'},
      {place_id:'2','名称':'通常','種別':'飲食店',latitude:'36.076',longitude:'138.084','おすすめ度':'3','自動提案':'normal','昼食向き':'○'}
    ];
    const out=PlannerCore.PlacePolicy.candidatePool(rows,'lunch',{at:12*60,day:'月',placeData:mockPD});
    return out.length===1 && out[0].id==='2';
  });

  test('バス待ちは吸収しない',()=>{
    const input=[
      {type:'act',wishType:'park',from:10*60,to:10*60+30,flexible:true},
      {type:'travel',from:10*60+30,to:10*60+35},
      {type:'wait',from:10*60+35,to:10*60+43,fixedTransport:true}
    ];
    return PlannerCore.GapOptimizer.absorbShortGaps(input).length===3;
  });

  Promise.all(rows.map(async r=>{
    if(r.ok && typeof r.ok.then==='function'){
      try{r.ok=!!(await r.ok)}catch(e){r.ok=false;r.error=String(e&&e.stack||e)}
    }
    return r;
  })).then(()=>{
  const ok=rows.filter(x=>x.ok).length;
  document.getElementById('out').innerHTML=
    '<p><b>'+ok+' / '+rows.length+' passed</b></p>'+
    rows.map(x=>'<div class="'+(x.ok?'ok':'ng')+'">'+(x.ok?'✓':'✗')+' '+x.name+(x.error?'<pre>'+x.error+'</pre>':'')+'</div>').join('');
  });
})();
</script>
</body>
</html>

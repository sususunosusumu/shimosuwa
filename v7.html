<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下諏訪 時間プランナー v7</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f4;color:#1f2933;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.w{max-width:1050px;margin:auto;padding:15px}.top{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}h1{margin:0;font-size:26px}.v{font-size:12px;background:#e7f1ed;color:#184b40;padding:5px 9px;border-radius:999px;font-weight:800}.p{background:#fff;border:1px solid #dce2e5;border-radius:16px;padding:15px;margin:13px 0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.sm{font-size:12px;color:#667085;line-height:1.55}label{display:block;font-size:12px;color:#667085;margin-bottom:4px}select,input,button{font:inherit;padding:9px;border-radius:9px}select,input{width:100%;border:1px solid #cdd5da;background:#fff}button{border:0;background:#245e52;color:#fff;font-weight:800;cursor:pointer}button.alt{background:#edf0f2;color:#34434f}button.danger{background:#fff0f0;color:#8f3030;border:1px solid #efcccc}.row,.palette,.actions,.sum{display:flex;gap:7px;flex-wrap:wrap}.palette{margin-top:10px}.palette button{background:#eef4f1;color:#245e52;border:1px solid #d8e7e0}.ep{border:1px solid #e0e5e8;border-radius:12px;padding:11px}.coord{font-size:11px;color:#7b8790;margin-top:6px}.wishlist,.plan{display:grid;gap:9px;margin-top:11px}.wish{display:grid;grid-template-columns:32px 1.1fr .72fr .65fr 1fr auto;gap:7px;align-items:end;border:1px solid #dce2e5;border-radius:13px;padding:10px;background:#fbfcfc}.num{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#e7f1ed;color:#245e52;font-weight:900;align-self:center}.ctrl{display:flex;gap:4px;align-self:center}.ctrl button{padding:6px 8px}.card{display:grid;grid-template-columns:82px 1fr;gap:9px;border:1px solid #dfe4e7;border-radius:13px;padding:11px}.card.travel{background:#f7f8f9;border-style:dashed}.card.warn{background:#fff2f2}.time{font-weight:900}.name{font-weight:900;font-size:15px}.meta{font-size:12px;color:#667085;margin-top:3px}.tag,.pill{display:inline-block;background:#eef2f2;border-radius:999px;padding:4px 7px;font-size:11px;color:#52606b;margin:4px 4px 0 0}#map{height:390px;border-radius:13px;margin-top:8px}.head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.title{font-size:17px;font-weight:900}@media(max-width:780px){.g2,.g4{grid-template-columns:1fr}.wish{grid-template-columns:30px 1fr 1fr}.wish .wide{grid-column:2/4}.ctrl{grid-column:2/4;justify-content:flex-end}#map{height:330px}.card{grid-template-columns:72px 1fr}.w{padding:11px}}</style></head><body><div class="w"><div class="top"><div><h1>下諏訪 時間プランナー</h1><div class="sm">やりたいことを積むと、時間内に入る順番と時刻を組み立てます。</div></div><span class="v">v7 block prototype</span></div><div class="p g2"><div class="ep"><label>START</label><select id="ss"></select><div class="row"><button onclick="gps('s')">現在地GPS</button><button class="alt" onclick="pick='s'">地図から選ぶ</button></div><div id="sc" class="coord">未設定</div></div><div class="ep"><label>GOAL</label><select id="gs"></select><div class="row"><button onclick="gps('g')">現在地GPS</button><button class="alt" onclick="pick='g'">地図から選ぶ</button></div><div id="gc" class="coord">未設定</div></div></div><div class="p g4"><div><label>曜日</label><select id="wd"><option>月</option><option>火</option><option>水</option><option>木</option><option>金</option><option>土</option><option>日</option></select></div><div><label>開始</label><input id="st" type="time" value="09:00"></div><div><label>終了</label><input id="et" type="time" value="16:00"></div><div><label>歩く速さ</label><select id="pace"><option value="4">標準</option><option value="3">ゆっくり</option><option value="5">速め</option></select></div></div><div class="p"><div class="head"><div><div class="title">やりたいこと</div><div class="sm">希望時刻は任意。空欄なら自動で決めます。</div></div><span id="wc" class="sm"></span></div><div class="palette"><button onclick="add('snack')">＋おやつ</button><button onclick="add('lunch')">＋昼食</button><button onclick="add('landmark')">＋観光</button><button onclick="add('onsen')">＋温泉</button><button onclick="add('cafe')">＋カフェ</button><button onclick="add('park')">＋公園</button><button onclick="add('rest')">＋休憩</button><button onclick="add('free')">＋自由時間</button></div><div id="wl" class="wishlist"></div><div class="actions" style="margin-top:11px"><button onclick="plan(false)">この希望でプランを作る</button><button class="alt" onclick="plan(true)">別プラン</button><button class="alt" onclick="sample()">サンプルに戻す</button></div></div><div class="p"><div class="head"><div class="title">提案プラン</div><span id="ps" class="sm">未作成</span></div><div id="summary" class="sum"></div><div id="result" class="plan"><div class="sm">STARTを設定すると試せます。GOALは下諏訪駅を自動選択します。</div></div></div><div class="p"><div class="head"><b>地図</b><span id="status" class="sm">読込中...</span></div><div id="map"></div><div class="sm" style="margin-top:7px">大きい点＝Place、小さい点＝既存GISのバス停。バス時刻表による乗車判定は次段階で接続します。</div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const $=x=>document.getElementById(x);let P=[],B=[],A=[],pick=null,pt={s:null,g:null},mk={s:null,g:null},route=null,W=[],seq=0;const M=L.map('map').setView([36.075,138.083],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(M);const D={snack:['🍰 おやつ',30],lunch:['🍽️ 昼食',50],landmark:['⛩️ 観光',40],onsen:['♨️ 温泉',50],cafe:['☕ カフェ',40],park:['🌳 公園・散歩',40],rest:['🪑 休憩',20],free:['⏳ 自由時間',30]};function csv(t){let a=[],r=[],f='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){f+='"';i++}else q=!q}else if(c===','&&!q){r.push(f);f=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x))a.push(r);r=[]}else f+=c}if(r.length||f){r.push(f);a.push(r)}let h=a.shift()||[];return a.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||''])))}const la=p=>+(p.latitude||p.lat||0),lo=p=>+(p.longitude||p.lng||0),hc=p=>la(p)&&lo(p);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dedup(x){let m=new Map;for(let p of x){let k=p['名称']||p.place_id;if(!k)continue;let o=m.get(k);if(!o||(!hc(o)&&hc(p))||(o['種別']==='ランドマーク'&&p['種別']==='交通'))m.set(k,p)}return [...m.values()]}function setp(k,p){pt[k]={name:p.name,lat:+p.lat,lng:+p.lng};$(k+'c').textContent=p.name+' / '+p.lat.toFixed(6)+', '+p.lng.toFixed(6);if(mk[k])M.removeLayer(mk[k]);mk[k]=L.marker([p.lat,p.lng]).addTo(M).bindPopup(k==='s'?'START':'GOAL').openPopup();M.setView([p.lat,p.lng],15)}function gps(k){navigator.geolocation.getCurrentPosition(x=>setp(k,{name:'現在地',lat:x.coords.latitude,lng:x.coords.longitude}),()=>alert('位置情報を取得できません'))}M.on('click',e=>{if(pick){setp(pick,{name:'地図で選択',lat:e.latlng.lat,lng:e.latlng.lng});pick=null}});function match(p,t){let c=(p['カテゴリ']||'')+' '+(p['種別']||'')+' '+(p['体験・できること']||'');if(t==='snack')return p['おやつ向き']==='○'||/カフェ|ベーカリー|軽食|菓子/.test(c);if(t==='lunch')return p['昼食向き']==='○'||p['種別']==='飲食店';if(t==='cafe')return /カフェ|喫茶/.test(c);if(t==='onsen')return /温泉|足湯/.test(c);if(t==='park')return /公園|自然|湖畔|散歩/.test(c);if(t==='rest')return p['休憩向き']==='○'||/休憩|公園|カフェ|温泉/.test(c);if(t==='landmark')return p['種別']!=='飲食店'&&p['種別']!=='交通'&&!/駅|バス停/.test(c);return false}function cand(t){return P.filter(p=>hc(p)&&match(p,t))}function add(t,o={}){W.push({id:++seq,t,d:o.d||D[t][1],time:o.time||'',pid:''});render()}function del(id){W=W.filter(x=>x.id!==id);render()}function mv(id,n){let i=W.findIndex(x=>x.id===id),j=i+n;if(i<0||j<0||j>=W.length)return;[W[i],W[j]]=[W[j],W[i]];render()}function ch(id,k,v){let w=W.find(x=>x.id===id);if(!w)return;w[k]=v;if(k==='t'){w.d=D[v][1];w.pid='';render()}}function render(){$('wc').textContent=W.length+'ブロック';$('wl').innerHTML=W.map((w,i)=>{let C=cand(w.t),opts='<option value="">場所もおまかせ</option>'+C.map(p=>`<option value="${esc(p.place_id||p['名称'])}" ${w.pid===(p.place_id||p['名称'])?'selected':''}>${esc(p['名称'])}</option>`).join('');return `<div class="wish"><div class="num">${i+1}</div><div class="wide"><label>内容</label><select onchange="ch(${w.id},'t',this.value)">${Object.entries(D).map(([k,v])=>`<option value="${k}" ${k===w.t?'selected':''}>${v[0]}</option>`).join('')}</select></div><div><label>希望時刻</label><input type="time" value="${w.time}" onchange="ch(${w.id},'time',this.value)"></div><div><label>滞在</label><select onchange="ch(${w.id},'d',+this.value)">${[15,20,30,40,50,60,90].map(n=>`<option ${n===+w.d?'selected':''}>${n}</option>`).join('')}</select></div><div class="wide"><label>場所</label><select onchange="ch(${w.id},'pid',this.value)">${opts}</select><div class="sm">候補 ${C.length}件</div></div><div class="ctrl"><button class="alt" onclick="mv(${w.id},-1)">↑</button><button class="alt" onclick="mv(${w.id},1)">↓</button><button class="danger" onclick="del(${w.id})">削除</button></div></div>`}).join('')}function sample(){W=[];seq=0;add('snack',{time:'10:00'});add('landmark');add('lunch',{time:'12:00'});add('onsen');add('snack',{time:'15:00'})}function min(s){if(!s)return null;let[a,b]=s.split(':').map(Number);return a*60+b}function fm(n){return String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(Math.round(n)%60).padStart(2,'0')}function dis(a,b){let R=6371,r=x=>x*Math.PI/180,dp=r(b.lat-a.lat),dl=r(b.lng-a.lng),q=Math.sin(dp/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function walk(a,b){return Math.max(2,Math.round(dis(a,b)/(+$('pace').value||4)*60*1.18))}function wdok(p){let w=$('wd').value;if((p['定休日']||'').includes(w))return false;let d=p['営業日']||'';return !d||d==='毎日'||(d==='平日'?!['土','日'].includes(w):d.includes(w))}function open(p,t){if(!wdok(p))return false;let s=p['営業時間']||'';if(!s||s.includes('24時間'))return true;let r=[...s.matchAll(/(\d{1,2}):(\d{2})\s*(?:-|〜|～)\s*(\d{1,2}):(\d{2})/g)];if(!r.length)return true;return r.some(x=>{let a=+x[1]*60+ +x[2],b=+x[3]*60+ +x[4];if(!b)b=1440;return t>=a&&t<=b})}function choose(w,from,goal,t,used,random){if(w.pid){let p=P.find(x=>(x.place_id||x['名称'])===w.pid);return p&&hc(p)?p:null}let c=cand(w.t).filter(p=>!used.has(p.place_id||p['名称'])&&open(p,t));if(!c.length)c=cand(w.t).filter(p=>!used.has(p.place_id||p['名称']));let s=c.map(p=>({p,n:walk(from,{lat:la(p),lng:lo(p)})+walk({lat:la(p),lng:lo(p)},goal)-(+(p['Google評価']||0)*2)})).sort((a,b)=>a.n-b.n);if(!s.length)return null;let top=s.slice(0,Math.min(5,s.length));return random?top[Math.floor(Math.random()*top.length)].p:top[0].p}function nearBus(q){let z=null;for(let b of B){let p={lat:+(b.latitude||b.lat),lng:+(b.longitude||b.lng)};if(!p.lat)continue;let d=dis(q,p);if(!z||d<z.d)z={b,d}}return z&&z.d<=.45?`<span class="tag">🚌 ${esc(z.b.stop_name||z.b.name||'バス停')} 約${Math.round(z.d*1000)}m</span>`:''}function plan(random){if(!pt.s||!pt.g){alert('STARTを設定してください');return}let t=min($('st').value),end=min($('et').value),cur={...pt.s},used=new Set,items=[['place',t,t,cur.name,'START',null]],warn=[];for(let w of W){let pref=min(w.time);if(pref!==null&&pref>t){items.push(['free',t,pref,'自由時間・余白','希望時刻まで',null]);t=pref}if(w.t==='free'){items.push(['free',t,t+w.d,'自由時間',w.d+'分',null]);t+=w.d;continue}let p=choose(w,cur,pt.g,t,used,random);if(!p){items.push(['warn',t,t+15,D[w.t][0]+'：候補なし','座標・営業時間・属性データの追加が必要',null]);warn.push(D[w.t][0]);t+=15;continue}let q={name:p['名称'],lat:la(p),lng:lo(p)},m=walk(cur,q);items.push(['travel',t,t+m,'徒歩 約'+m+'分',cur.name+' → '+q.name,null]);t+=m;if(!open(p,t))warn.push(p['名称']+' 営業時間要確認');items.push(['act',t,t+w.d,p['名称'],D[w.t][0]+' / '+(p['カテゴリ']||''),p]);t+=w.d;used.add(p.place_id||p['名称']);cur=q}let m=walk(cur,pt.g);items.push(['travel',t,t+m,'徒歩 約'+m+'分',cur.name+' → '+pt.g.name,null]);t+=m;if(t<end){items.push(['free',t,end,'余裕時間','GOALまで '+(end-t)+'分の余裕',null]);t=end}items.push([t>end?'warn':'place',end,end,pt.g.name,t>end?'GOAL 約'+(t-end)+'分超過':'GOAL',null]);$('ps').textContent=t>end?'時間超過':'成立';$('summary').innerHTML=`<span class="pill">${$('wd').value}曜日</span><span class="pill">${fm(min($('st').value))} → ${fm(end)}</span><span class="pill">希望 ${W.length}件</span>`;$('result').innerHTML=items.map(x=>`<div class="card ${x[0]==='travel'?'travel':''} ${x[0]==='warn'?'warn':''}"><div class="time">${x[1]===x[2]?fm(x[1]):fm(x[1])+'–'+fm(x[2])}</div><div><div class="name">${esc(x[3])}</div><div class="meta">${esc(x[4])}</div>${x[5]?nearBus({lat:la(x[5]),lng:lo(x[5])}):''}</div></div>`).join('');if(route)M.removeLayer(route);let pts=[pt.s];for(let x of items)if(x[5])pts.push({lat:la(x[5]),lng:lo(x[5])});pts.push(pt.g);route=L.polyline(pts.map(x=>[x.lat,x.lng]),{weight:4,opacity:.65}).addTo(M);M.fitBounds(route.getBounds().pad(.15))}async function init(){try{let files=['data/places.csv','data/places_extra.csv','data/places_services.csv'],texts=await Promise.all(files.map(u=>fetch(u).then(r=>r.ok?r.text():'')));P=dedup(texts.flatMap(t=>t?csv(t):[]));let r=await fetch('data/bus_stops_corrected.json'),j=r.ok?await r.json():[];B=Array.isArray(j)?j:(j.items||j.stops||[]);A=P.filter(hc).map(p=>({name:p['名称'],lat:la(p),lng:lo(p),kind:p['種別']})).concat(B.map(b=>({name:b.stop_name||b.name,lat:+(b.latitude||b.lat),lng:+(b.longitude||b.lng),kind:(b.bus_system||'バス')+' バス停'})).filter(x=>x.lat));for(let [id,k] of [['ss','s'],['gs','g']]){let e=$(id);e.innerHTML='<option value="">登録地点から選ぶ</option>'+A.map((p,i)=>`<option value="${i}">${esc(p.name)} — ${esc(p.kind)}</option>`).join('');e.onchange=()=>{if(e.value!=='')setp(k,A[+e.value])}}P.filter(hc).forEach(p=>L.circleMarker([la(p),lo(p)],{radius:p['種別']==='交通'?8:6,weight:1,fillOpacity:.6}).addTo(M).bindPopup(`<b>${esc(p['名称'])}</b><br>${esc(p['カテゴリ']||p['種別'])}`));B.forEach(b=>{let a=+(b.latitude||b.lat),o=+(b.longitude||b.lng);if(a&&o)L.circleMarker([a,o],{radius:2.5,weight:1,opacity:.4,fillOpacity:.25}).addTo(M).bindPopup(esc(b.stop_name||b.name||'バス停'))});let stn=A.find(x=>x.name==='下諏訪駅'&&x.kind==='交通')||A.find(x=>x.name==='下諏訪駅');if(stn){let i=A.indexOf(stn);$('gs').value=i;setp('g',stn)}$('status').textContent=`Places ${P.length}件（座標あり ${P.filter(hc).length}件） / バス停 ${B.length}地点`;sample()}catch(e){$('status').textContent='読込エラー: '+e.message}}init();</script></body></html>
